services:
  mysql:
    image: mysql:8.0
    container_name: event-ticketing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: event_ticketing
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: event-ticketing-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: event_ticketing
      DB_USERNAME: root
      DB_PASSWORD: root
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"

volumes:
  mysql-data:
