services:
  mysql:
    image: mysql:8.0
    container_name: event-ticketing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: event_ticketing
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: event-ticketing-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: event-ticketing-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: event_ticketing
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Force the in-container port to 8080 regardless of the app's host default, so the
      # port mapping below is stable. Host/IDE runs keep their own SERVER_PORT default (8089).
      SERVER_PORT: 8080
      SEED_DEMO_DATA: "true"
    ports:
      - "${APP_PORT:-8090}:8080"

volumes:
  mysql-data:
