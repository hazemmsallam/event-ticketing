spring:
  application:
    name: event-ticketing
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:event_ticketing}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Flyway is the single source of truth for the schema; Hibernate never alters it.
      # MUST stay `validate` (or `none`): with `update`/`create` Hibernate silently recreates
      # tables from the entities, which drops the things it cannot see — notably the generated
      # `active_lock` column and its UNIQUE index, i.e. the entire double-booking guard.
      # `validate` fails startup loudly on drift instead of running without the constraint.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast if Redis is momentarily unreachable; cache errors degrade to a DB read.
      timeout: 500ms

app:
  # Set to true to load a small predefined catalog on startup (see DemoDataSeeder).
  seed-demo-data: ${SEED_DEMO_DATA:true}
  reservation:
    # ISO-8601 duration. How long a seat stays HELD before auto-release if unpaid.
    hold-duration: PT10M
    # Maximum number of seats a single booking may hold.
    max-seats-per-booking: 2
    # How often the sweeper job releases expired holds.
    sweep-interval: PT30S
    # How long availability/seat-map reads are cached in Redis. Short by design: a stale
    # entry can never cause a double-booking (the DB unique index still guards writes), it
    # only briefly delays what the UI shows.
    cache-ttl: PT2S
    # How long a payment may sit in the in-doubt INITIATED state before the reconciliation
    # job resolves it (confirm the booking or refund the charge).
    reconcile-after: PT1M

server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    com.eventticketing: debug
